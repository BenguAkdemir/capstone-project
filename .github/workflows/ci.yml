name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --cov=backend --cov-report=xml
        continue-on-error: true

  lint-and-test-solver:
    name: Solver — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./solver

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff
        continue-on-error: true

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --cov=solver --cov-report=xml
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-test-backend, lint-and-test-solver]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t scheduling-backend:${{ github.sha }} .

      - name: Build solver image
        run: docker build -f solver/Dockerfile -t scheduling-solver:${{ github.sha }} .

      - name: Verify compose config
        run: docker compose config --quiet
